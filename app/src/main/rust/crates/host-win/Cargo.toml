[package]
name = "baicodex-host-win"
version = "2.0.0"
edition = "2021"
rust-version = "1.78"
publish = false
description = "baicodex 的 Windows 原生宿主：无边框窗口、DWM 液态玻璃、WebView2 渲染面"

[[bin]]
name = "baicodex-desktop"
path = "src/main.rs"

[dependencies]
# 内核。关掉 tui，桌面端不需要终端库。
baicodex = { path = "../..", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
# 只为了 `broadcast::Receiver` 的类型与阻塞接收；不建运行时。
tokio = { version = "1", features = ["sync"] }

# Windows 相关全部挂在 cfg 下：在 Linux/CI 上 `cargo check --workspace` 仍然能过，
# 只是不编译这些依赖（宿主本身在非 Windows 上是空壳，见 lib.rs）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_DataExchange",
  "Win32_Storage_FileSystem",
] }
windows-core = "0.62"
webview2-com = "0.39"

[build-dependencies]
# 只为在 Windows 上打 app.manifest（DPI 感知 + 支持的 OS 版本）。
# 非 Windows 上什么也不做。
