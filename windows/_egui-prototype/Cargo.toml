[package]
name = "baicodex-windows"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "baicodex"
path = "src/main.rs"

[dependencies]
# eframe = egui + 窗口后端，纯 Rust GUI，适合 MVP 快速迭代
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }

[profile.release]
opt-level = 2
strip = true

[workspace]
