<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 关掉页面级的缩放与双击放大：桌面窗口不需要，还会跟自定义手势打架 -->
    <meta name="color-scheme" content="light dark" />
    <title>baicodex</title>
    <style>
      /* 在 JS 加载前先把底色铺好，避免启动瞬间闪白 */
      html, body { margin: 0; height: 100%; background: transparent; }
      html { background: #edf0f6; }
      html[data-theme="dark"] { background: #0d0f14; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, "Microsoft YaHei UI", sans-serif;
        font-size: 13px;
        color: #8b91a1;
        transition: opacity 240ms ease;
      }
      html[data-theme="dark"] #boot { color: #6a7185; }
      #boot[data-ready="true"] { opacity: 0; pointer-events: none; }
      .boot-dot {
        width: 28px; height: 28px; border-radius: 9px;
        background: linear-gradient(135deg, #5b8cff, #a876ff);
        box-shadow: 0 8px 24px -6px rgba(91, 140, 255, 0.6);
        animation: boot-breathe 1.6s ease-in-out infinite;
      }
      #boot .boot-wrap { display: grid; justify-items: center; gap: 14px; }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-dot { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="boot-wrap">
        <div class="boot-dot"></div>
        <div>正在启动内核…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
